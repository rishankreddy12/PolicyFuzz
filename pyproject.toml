[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policyfuzz"
version = "0.1.0"
description = "PolicyFuzz — SOP Divergence Auditor"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "streamlit>=1.37",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["policyfuzz*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
